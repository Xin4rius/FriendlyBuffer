# Tests à chaque push ; release Gitea (zip + changelog) quand un tag de version est poussé.
# CurseForge récupère l'addon depuis le miroir GitHub : rien n'est envoyé d'ici.
#
# Publier :  git tag -a v1.2.0 -m "v1.2.0"  puis  git push origin v1.2.0
# Un tag contenant « beta » ou « alpha » donne une pré-version.
# Release d'un tag déjà poussé : Actions > CI / Release > Run workflow, avec le tag.
name: CI / Release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a release (e.g. v1.0.0)
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq lua5.1

      - name: Unit tests
        run: lua5.1 tests/run.lua

      - name: Smoke test (mocked WoW API)
        run: lua5.1 tests/smoke.lua

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Historique complet : le packager lit les tags pour la version et le changelog.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag poussé, ou tag saisi au lancement manuel. Choisi en shell : le runner évalue mal
      # les expressions « a || b ».
      - name: Select tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          git checkout -q "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install packager dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq jq zip unzip subversion

      # Script du packager lancé directement : act_runner ne sait pas résoudre le tag « v2 » de
      # l'action BigWigsMods/packager. -d : construit le zip (.pkgmeta, @project-version@) sans envoi.
      - name: Build package
        run: curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh | bash -s -- -d

      - name: Create Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          ZIP=$(ls .release/*.zip | head -n 1)
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}$TAG
          NOTES=$(git log --no-merges --format='- %s' "$RANGE")
          case "$TAG" in *alpha*|*beta*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg body "$NOTES" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, prerelease: $pre}')
          ID=$(curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$API/releases" | jq -r .id)
          curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$ZIP" \
            "$API/releases/$ID/assets?name=$(basename "$ZIP")" > /dev/null
          echo "Release $TAG : $(basename "$ZIP")"
