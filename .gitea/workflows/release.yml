# Pousser un tag (git tag -a v1.3.1 -m "v1.3.1" puis git push --follow-tags origin main) : tests,
# envoi sur CurseForge par le packager BigWigs, puis release Gitea avec le zip.
# Un tag contenant « beta » ou « alpha » donne une version bêta / alpha sur CurseForge.
#
# Gitea, Actions > Secrets   : CF_API_KEY             (curseforge.com > My API Tokens)
# Gitea, Actions > Variables : CURSEFORGE_PROJECT_ID  (ID numérique du projet CurseForge)
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # le packager lit les tags pour nommer la version

      - name: Install tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq lua5.1 jq zip

      - name: Test
        run: |
          lua5.1 tests/run.lua
          lua5.1 tests/smoke.lua

      # Script plutôt que l'action : act ne résout pas le tag v2 du packager (« unsupported object type »).
      # Notes de version : CHANGELOG.md (.pkgmeta, manual-changelog), jamais les messages de commit.
      # Sans clé, le packager construit le zip mais n'envoie rien, sans erreur : on échoue avant.
      - name: Package and upload
        run: |
          [ -n "$CF_API_KEY" ] || { echo "::error::Secret CF_API_KEY manquant : rien ne serait envoyé sur CurseForge"; exit 1; }
          [ -n "$PROJECT_ID" ] || { echo "::error::Variable CURSEFORGE_PROJECT_ID manquante"; exit 1; }
          curl -s https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh | bash -s -- -p "$PROJECT_ID"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}

      # Release Gitea du tag, avec le zip empaqueté (pas l'archive des sources).
      - name: Gitea release
        env:
          TOKEN: ${{ gitea.token }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          TAG: ${{ gitea.ref_name }}
        run: |
          set -e
          ZIP=$(ls .release/*.zip)
          jq -n --arg tag "$TAG" --rawfile body CHANGELOG.md '{tag_name: $tag, name: $tag, body: $body}' > release.json
          ID=$(curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d @release.json "$API/releases" | jq -r .id)
          curl -sf -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@$ZIP" "$API/releases/$ID/assets?name=$(basename "$ZIP")" > /dev/null
          echo "Release $TAG créée avec $(basename "$ZIP")"
