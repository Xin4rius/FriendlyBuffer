# Tests à chaque push. Push sur main, tests passés : la CI crée le tag de version suivant (patch :
# v1.1.0 -> v1.1.1), puis release Gitea (zip + changelog) et packager CurseForge déclenché
# (webhook) une fois le tag arrivé sur le miroir GitHub.
#
# Gitea, Actions > Secrets   : CF_API_TOKEN           (jeton API CurseForge)
# Gitea, Actions > Variables : CURSEFORGE_PROJECT_ID  (ID numérique du projet CurseForge)
#
# Version mineure ou majeure : taguer le commit soi-même et pousser le tag avec main
#   (git tag -a v1.2.0 -m "v1.2.0"  puis  git push --follow-tags origin main) : la CI le reprend.
# Un tag contenant « beta » ou « alpha » donne une pré-version.
# Push sans release : « [skip ci] » dans le message du commit.
# Release d'un tag déjà poussé : Actions > CI / Release > Run workflow, avec le tag.
name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a release (e.g. v1.0.0)
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq lua5.1

      - name: Unit tests
        run: lua5.1 tests/run.lua

      - name: Smoke test (mocked WoW API)
        run: lua5.1 tests/smoke.lua

  # Tag de la release : celui saisi au lancement manuel, sinon un tag de version déjà posé sur le
  # commit, sinon le patch suivant du dernier tag vX.Y.Z, créé et poussé ici.
  tag:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -n "$LAST" ]; then
              TAG="${LAST%.*}.$((${LAST##*.} + 1))"
            else
              TAG=v1.0.0
            fi
            git config user.name "Gitea Actions"
            git config user.email "actions@noreply.localhost"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag : $TAG"

  release:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # Historique complet : le packager lit les tags pour la version et le changelog.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          git checkout -q "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install packager dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq jq zip unzip subversion

      # Script du packager lancé directement : act_runner ne sait pas résoudre le tag « v2 » de
      # l'action BigWigsMods/packager. -d : construit le zip (.pkgmeta, @project-version@) sans envoi.
      - name: Build package
        run: curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh | bash -s -- -d

      - name: Create Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          # Relance d'un tag déjà publié (ex. renvoi sur CurseForge) : la release existe déjà.
          if curl -sf -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" > /dev/null; then
            echo "Release $TAG déjà présente"; exit 0
          fi
          ZIP=$(ls .release/*.zip | head -n 1)
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}$TAG
          NOTES=$(git log --no-merges --format='- %s' "$RANGE")
          case "$TAG" in *alpha*|*beta*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg body "$NOTES" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, prerelease: $pre}')
          ID=$(curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$API/releases" | jq -r .id)
          curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$ZIP" \
            "$API/releases/$ID/assets?name=$(basename "$ZIP")" > /dev/null
          echo "Release $TAG : $(basename "$ZIP")"

      # CurseForge empaquette lui-même depuis le miroir GitHub (webhook) : on attend que le miroir
      # ait reçu le tag, puis on déclenche son packager.
      - name: Trigger CurseForge packager
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MIRROR: https://github.com/${{ github.repository }}.git
        run: |
          set -eu
          [ -n "$CF_API_TOKEN" ] || { echo "::error::Secret CF_API_TOKEN manquant"; exit 1; }
          [ -n "$PROJECT_ID" ] || { echo "::error::Variable CURSEFORGE_PROJECT_ID manquante"; exit 1; }
          for i in $(seq 1 60); do
            git ls-remote --exit-code --tags "$MIRROR" "refs/tags/$TAG" > /dev/null && break
            [ "$i" -lt 60 ] || { echo "::error::$TAG absent du miroir GitHub après 10 min"; exit 1; }
            sleep 10
          done
          curl -sSf -X POST -d '' "https://www.curseforge.com/api/projects/$PROJECT_ID/package?token=$CF_API_TOKEN"
          echo "Packager CurseForge déclenché pour $TAG"
